<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Love & Memories - Smart Architectural View</title>
  
  <!-- Google Fonts for Amharic & Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pink-dark: #2a081a;
      --bg-pink-mid: #4a0e2e;
      --pink-primary: #ec4899;
      --pink-light: #f472b6;
      --pink-glow: rgba(236, 72, 153, 0.35);
      --glass-bg: rgba(255, 240, 245, 0.05);
      --glass-border: rgba(244, 114, 182, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #581c3f 0%, #2e081d 60%, #17030e 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Architectural Grid Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(244, 114, 182, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 114, 182, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    /* Start Screen Overlay */
    .start-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(23, 3, 14, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 90%;
      width: 400px;
    }

    .start-title {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .btn-start {
      background: linear-gradient(135deg, #f472b6, #db2777);
      color: #fff;
      border: none;
      padding: 14px 38px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--pink-glow);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      letter-spacing: 0.5px;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(236, 72, 153, 0.5);
    }

    /* Amharic Love Message Banner */
    .love-message-container {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      width: 90%;
      max-width: 600px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    .love-message-container.visible {
      opacity: 1;
    }

    .love-message {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #fbcfe8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(244, 114, 182, 0.5);
      letter-spacing: 0.5px;
      padding: 12px 24px;
      background-color: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      display: inline-block;
    }

    #canvas-container {
      width: 100%;
      height: 100vh;
      touch-action: none;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 2, 9, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(42, 8, 26, 0.9);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    .modal-img {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 3/4;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease;
    }

    .btn-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- START OVERLAY -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <h2 class="start-title">❤️ ለየት ያለ ስጦታ ❤️</h2>
      <button class="btn-start" id="startBtn">Start ✨</button>
    </div>
  </div>

  <!-- AMHARIC TEXT HEADER -->
  <div class="love-message-container" id="loveMessage">
    <h1 class="love-message">❤️ የኔ ፍቅር እወድሻለው ሁሌም ኑሪሊኝ ❤️</h1>
  </div>

  <div id="canvas-container"></div>

  <div class="modal" id="photoModal">
    <div class="modal-content">
      <img id="modalImage" class="modal-img" src="" alt="Memory Detail">
      <div class="modal-actions">
        <button class="btn-close" id="closeBtn">ዘጋ</button>
      </div>
    </div>
  </div>

  <script>
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const loveMessage = document.getElementById('loveMessage');

    startBtn.addEventListener('click', () => {
      startOverlay.classList.add('hidden');
      loveMessage.classList.add('visible');
    });

    const imageUrls = [
      "https://i.ibb.co/QF58H26T/IMG-20260926-094631-722.jpg",
      "https://i.ibb.co/5WkxYFmq/IMG-20260926-094628-188.jpg",
      "https://i.ibb.co/tW3kPhg/IMG-20260926-094624-765.jpg",
      "https://i.ibb.co/NdwMvjqf/IMG-20260926-094834-971.jpg",
      "https://i.ibb.co/4RQQgSVW/IMG-20260926-094832-263.jpg",
      "https://i.ibb.co/B53W19Sw/IMG-20260926-094814-672.jpg",
      "https://i.ibb.co/hRXx7fYK/IMG-20260926-094812-887.jpg",
      "https://i.ibb.co/5NNFPf1/IMG-20260926-094811-842.jpg",
      "https://i.ibb.co/mCPfxShY/IMG-20260926-094809-742.jpg"
    ];

    const centerImageUrl = "https://i.ibb.co/NdwMvjqf/IMG-20260926-094834-971.jpg";

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -0.2, 5.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.LinearEncoding; 
    container.appendChild(renderer.domElement);

    const carouselGroup = new THREE.Group();
    scene.add(carouselGroup);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // CENTER CIRCLE
    const circleGeometry = new THREE.CircleGeometry(0.85, 64);
    const centerMesh = new THREE.Mesh(
      circleGeometry,
      new THREE.MeshBasicMaterial({ visible: false })
    );
    centerMesh.userData = { id: 'center', url: centerImageUrl };
    scene.add(centerMesh);

    const ringGeometry = new THREE.RingGeometry(0.87, 0.91, 64);
    const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide });
    const borderRing = new THREE.Mesh(ringGeometry, ringMaterial);
    centerMesh.add(borderRing);

    textureLoader.load(centerImageUrl, (texture) => {
      texture.encoding = THREE.LinearEncoding;
      centerMesh.material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        toneMapped: false
      });
      centerMesh.material.needsUpdate = true;
    });

    // CAROUSEL RING
    const radius = 2.6;
    const count = imageUrls.length;
    const cardMeshes = [centerMesh];

    imageUrls.forEach((url, index) => {
      const angle = (index / count) * Math.PI * 2;
      const geometry = new THREE.PlaneGeometry(0.9, 1.3);

      const card = new THREE.Mesh(
        geometry,
        new THREE.MeshBasicMaterial({ visible: false })
      );

      card.position.x = Math.sin(angle) * radius;
      card.position.z = Math.cos(angle) * radius;
      card.rotation.y = angle;
      card.userData = { id: index, url: url };

      carouselGroup.add(card);
      cardMeshes.push(card);

      textureLoader.load(url, (texture) => {
        texture.encoding = THREE.LinearEncoding;
        card.material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          toneMapped: false
        });
        card.material.needsUpdate = true;
      });
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isDragging = false;
    let previousX = 0, previousY = 0;
    let targetRotationX = 0, targetRotationY = 0;
    let dragDistance = 0;

    function getCoords(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onPointerDown(e) {
      if (!startOverlay.classList.contains('hidden')) return;
      isDragging = true;
      dragDistance = 0;
      const coords = getCoords(e);
      previousX = coords.x;
      previousY = coords.y;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const coords = getCoords(e);
      const deltaX = coords.x - previousX;
      const deltaY = coords.y - previousY;

      dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

      targetRotationY += deltaX * 0.006;
      targetRotationX += deltaY * 0.006;

      previousX = coords.x;
      previousY = coords.y;
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      if (dragDistance < 10) {
        checkCardClick(e);
      }
    }

    function checkCardClick(e) {
      const coords = getCoords(e.changedTouches ? e.changedTouches[0] : e);
      mouse.x = (coords.x / window.innerWidth) * 2 - 1;
      mouse.y = -(coords.y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cardMeshes);

      if (intersects.length > 0) {
        const clickedCard = intersects[0].object;
        openModal(clickedCard.userData.url);
      }
    }

    const modal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.getElementById('closeBtn');

    function openModal(url) {
      modalImg.src = url;
      modal.style.display = 'flex';
    }

    closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown);
    window.addEventListener('touchmove', onPointerMove);
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      carouselGroup.rotation.y += (targetRotationY - carouselGroup.rotation.y) * 0.1;
      carouselGroup.rotation.x += (targetRotationX - carouselGroup.rotation.x) * 0.1;

      if (!isDragging) {
        targetRotationY += 0.001;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
